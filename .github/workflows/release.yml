name: Release

# Triggered when a version tag (v0.1.0, v1.2.3, ...) is pushed.
# Builds all four browser targets, zips them, and attaches them to a
# GitHub Release so users can download ready-to-install packages.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed by softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tests
        run: npm test

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: |
          npm run build
          npm run build:edge
          npm run build:firefox
          npm run build:safari

      - name: Package all targets
        run: |
          npm run zip
          npm run zip:firefox
        env:
          # Edge shares the Chromium build; Safari needs no separate zip for install.
          # We produce chrome + firefox zips; rename edge build into its own zip
          # so Edge users have an obviously-named artifact.
          WXT_DEBUG: 0

      - name: Produce Edge-named zip
        run: |
          cp .output/sniff-hls-${{ steps.ver.outputs.version }}-chrome.zip \
             .output/sniff-hls-${{ steps.ver.outputs.version }}-edge.zip

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## Sniffls v${{ steps.ver.outputs.version }}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since $PREV_TAG"
              echo ""
              git log --pretty=format:"- %s" "$PREV_TAG"..HEAD
              echo ""
            else
              echo "First tagged release."
            fi
            echo ""
            echo "### Install (offline / unpacked)"
            echo ""
            echo "| Browser | File |"
            echo "|---|---|"
            echo "| Chrome | \`sniff-hls-${{ steps.ver.outputs.version }}-chrome.zip\` — unzip, then load unpacked at chrome://extensions |"
            echo "| Edge | \`sniff-hls-${{ steps.ver.outputs.version }}-edge.zip\` — unzip, then load unpacked at edge://extensions |"
            echo "| Firefox | \`sniff-hls-${{ steps.ver.outputs.version }}-firefox.zip\` — load via about:debugging |"
            echo "| Safari | build from source with Xcode |"
            echo ""
            echo "See the README for full per-browser instructions."
          } >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sniffls v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          tag_name: ${{ github.ref_name }}
          files: |
            .output/sniff-hls-${{ steps.ver.outputs.version }}-chrome.zip
            .output/sniff-hls-${{ steps.ver.outputs.version }}-edge.zip
            .output/sniff-hls-${{ steps.ver.outputs.version }}-firefox.zip
