<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="420" height="520" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <rect x="0" y="0" width="420" height="56" rx="16" fill="#ffffff"/>
  <rect x="0" y="40" width="420" height="16" fill="#ffffff"/>
  <text x="20" y="34" font-size="15" font-weight="700" fill="#0f172a">Sniffls</text>
  <text x="118" y="34" font-size="11" fill="#64748b">example.com</text>
  <!-- header icons: refresh, manager, settings -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <path d="M336 24 a10 10 0 1 0 10 -10"/>
    <path d="M346 24 l-3 -3 M346 24 l3 -3"/>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 14 h3 v12 h-12 v-3"/>
    <path d="M359 23 v3 h3"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="396" cy="22" r="6"/>
    <path d="M392 30 h8 M396 16 v0"/>
    <path d="M392 34 a6 6 0 0 1 8 0"/>
  </g>
  <line x1="0" y1="56" x2="420" y2="56" stroke="#e2e8f0"/>

  <!-- Empty state: search icon with breathing halo -->
  <circle cx="210" cy="130" r="46" fill="#eef2ff" opacity="0.55"/>
  <circle cx="210" cy="130" r="30" fill="#eef2ff" opacity="0.8"/>
  <circle cx="210" cy="130" r="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
    <circle cx="205" cy="125" r="9" fill="none" stroke="#94a3b8"/>
    <path d="M212 132 l8 8" stroke="#94a3b8"/>
  </g>
  <text x="210" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">No m3u8 detected yet</text>
  <text x="210" y="216" text-anchor="middle" font-size="10" fill="#64748b">Open a page with HLS video, or click refresh to scan the page.</text>
  <rect x="158" y="230" width="104" height="30" rx="8" fill="#4f46e5"/>
  <text x="210" y="249" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">⟳ Scan page</text>

  <!-- Footer -->
  <line x1="0" y1="390" x2="420" y2="390" stroke="#e2e8f0"/>
  <text x="20" y="412" font-size="11" fill="#64748b">Detected: 0 · </text>
  <text x="90" y="412" font-size="11" fill="#4f46e5" text-decoration="underline">open manager</text>
  <text x="20" y="436" font-size="9" fill="#94a3b8">Auto-detect on · DOM scan on</text>

  <!-- dark variant label -->
  <rect x="20" y="460" width="380" height="44" rx="10" fill="#0f172a"/>
  <text x="34" y="478" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="0.5">DARK MODE</text>
  <text x="34" y="496" font-size="11" font-weight="600" fill="#f1f5f9">same popup, theme-aware tokens</text>
  <rect x="300" y="472" width="86" height="22" rx="7" fill="#818cf8"/>
  <text x="343" y="487" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">Download</text>
</svg>
