<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="440" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Sidebar -->
  <rect x="1" y="1" width="120" height="378" fill="#f8fafc"/>
  <rect x="0" y="0" width="120" height="380" rx="14" fill="none" stroke="#e2e8f0"/>
  <rect x="120" y="0" width="1" height="380" fill="#e2e8f0"/>
  <!-- brand -->
  <rect x="14" y="14" width="24" height="24" rx="7" fill="url(#g)"/>
  <circle cx="26" cy="26" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M29.5 29.5 L33 33" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="44" y="30" font-size="11" font-weight="700" fill="#0f172a">Sniffls</text>
  <!-- nav: settings active -->
  <rect x="20" y="64" width="10" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <circle cx="25" cy="69" r="2" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="38" y="73" font-size="10" fill="#64748b">Downloads</text>
  <rect x="10" y="86" width="100" height="26" rx="7" fill="#eef2ff"/>
  <circle cx="25" cy="99" r="3.2" fill="none" stroke="#4f46e5" stroke-width="1.6"/>
  <path d="M25 93.5 V91 M25 107 V104.5 M21.5 99 H19 M31 99 H28.5" stroke="#4f46e5" stroke-width="1.4" stroke-linecap="round"/>
  <text x="38" y="103" font-size="10" font-weight="600" fill="#4f46e5">Settings</text>

  <!-- Content header -->
  <text x="140" y="34" font-size="14" font-weight="700" fill="#0f172a">Settings</text>
  <text x="140" y="48" font-size="9.5" fill="#64748b">Tune detection, downloads, and proxy.</text>
  <line x1="140" y1="58" x2="420" y2="58" stroke="#e2e8f0"/>

  <!-- General section -->
  <rect x="140" y="68" width="280" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="152" y="86" font-size="10.5" font-weight="700" fill="#0f172a">General</text>
  <text x="152" y="102" font-size="10" fill="#0f172a">Language</text>
  <rect x="370" y="90" width="42" height="16" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="378" y="102" font-size="8.5" fill="#0f172a">English</text>

  <!-- Detection section -->
  <rect x="140" y="120" width="280" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="152" y="86" font-size="10.5" font-weight="700" fill="#0f172a">Detection</text>
  <text x="152" y="154" font-size="10" fill="#0f172a">Auto-detect m3u8 on every page</text>
  <rect x="384" y="144" width="26" height="14" rx="7" fill="#4f46e5"/>
  <circle cx="403" cy="151" r="5" fill="#ffffff"/>

  <!-- Downloads section -->
  <rect x="140" y="184" width="280" height="80" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="152" y="202" font-size="10.5" font-weight="700" fill="#0f172a">Downloads</text>
  <text x="152" y="219" font-size="10" fill="#0f172a">Download directory</text>
  <rect x="266" y="208" width="106" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="274" y="222" font-size="9" fill="#0f172a">D:\Videos</text>
  <rect x="378" y="208" width="34" height="20" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="395" y="222" text-anchor="middle" font-size="8.5" fill="#4f46e5">Browse…</text>
  <!-- concurrency slider -->
  <text x="152" y="244" font-size="10" fill="#0f172a">Concurrency: 6</text>
  <rect x="266" y="290" width="106" height="4" rx="2" fill="#e2e8f0"/>
  <rect x="266" y="290" width="64" height="4" rx="2" fill="#4f46e5"/>
  <circle cx="330" cy="240" r="5" fill="#4f46e5"/>

  <!-- Proxy section -->
  <rect x="140" y="272" width="280" height="48" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="152" y="290" font-size="10.5" font-weight="700" fill="#0f172a">Proxy</text>
  <rect x="152" y="298" width="60" height="16" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="160" y="310" font-size="8.5" fill="#0f172a">SOCKS5</text>
  <rect x="218" y="298" width="86" height="16" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="226" y="310" font-size="8.5" fill="#64748b">127.0.0.1</text>
  <rect x="310" y="298" width="42" height="16" rx="5" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="331" y="310" text-anchor="middle" font-size="8.5" fill="#0f172a">1080</text>

  <!-- Bottom bar: Save (primary) + Reset + saved hint -->
  <rect x="140" y="338" width="46" height="24" rx="7" fill="#4f46e5"/>
  <text x="163" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Save</text>
  <rect x="194" y="338" width="76" height="24" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="232" y="354" text-anchor="middle" font-size="10" fill="#334155">Reset</text>
  <text x="280" y="354" font-size="9" fill="#16a34a">✓ Saved</text>
