<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="440" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Page header: brand icon + title + language/settings actions -->
  <rect x="20" y="16" width="26" height="26" rx="7" fill="url(#g)"/>
  <circle cx="30" cy="26" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M33.5 29.5 L37 33" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <text x="54" y="30" font-size="14" font-weight="700" fill="#0f172a">Sniffls — Settings</text>
  <text x="54" y="44" font-size="10" fill="#64748b">Tune detection, downloads, and proxy.</text>
  <rect x="336" y="20" width="36" height="18" rx="6" fill="#f1f5f9"/>
  <text x="354" y="32" text-anchor="middle" font-size="9" fill="#334155">中文</text>
  <rect x="378" y="20" width="36" height="18" rx="6" fill="#f1f5f9"/>
  <circle cx="393" cy="27" r="2.4" fill="none" stroke="#475569" stroke-width="1.4"/>
  <path d="M393 24.6 V21.6 M393 32.4 V29.4 M390.6 27 H387.6 M398.4 27 H395.4" stroke="#475569" stroke-width="1.2"/>
  <line x1="20" y1="56" x2="420" y2="56" stroke="#e2e8f0"/>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Detection section -->
  <rect x="20" y="66" width="400" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="86" font-size="12" font-weight="700" fill="#0f172a">Detection</text>
  <text x="34" y="104" font-size="11" fill="#0f172a">Auto-detect m3u8 on every page</text>
  <text x="34" y="118" font-size="9" fill="#64748b">Sniffs network requests and shows a badge count.</text>
  <!-- pill toggle on -->
  <rect x="376" y="98" width="34" height="18" rx="9" fill="#4f46e5"/>
  <circle cx="398" cy="107" r="6.5" fill="#ffffff"/>

  <!-- Downloads section -->
  <rect x="20" y="146" width="400" height="98" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="166" font-size="12" font-weight="700" fill="#0f172a">Downloads</text>
  <text x="34" y="186" font-size="11" fill="#0f172a">Output format</text>
  <rect x="290" y="174" width="114" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="189" font-size="10" fill="#0f172a">Auto (MP4→TS)</text>
  <text x="34" y="212" font-size="11" fill="#0f172a">Download directory</text>
  <rect x="150" y="200" width="204" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="158" y="215" font-size="10" fill="#0f172a">D:\Videos</text>
  <rect x="360" y="200" width="44" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="382" y="215" text-anchor="middle" font-size="10" fill="#4f46e5">Browse…</text>
  <rect x="290" y="208" width="0" height="0" fill="none"/>

  <!-- Proxy section -->
  <rect x="20" y="252" width="400" height="56" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="272" font-size="12" font-weight="700" fill="#0f172a">Proxy</text>
  <rect x="34" y="282" width="96" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="44" y="297" font-size="10" fill="#0f172a">SOCKS5</text>
  <rect x="136" y="282" width="150" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="144" y="297" font-size="10" fill="#64748b">127.0.0.1</text>
  <rect x="292" y="282" width="50" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="317" y="297" text-anchor="middle" font-size="10" fill="#0f172a">1080</text>

  <!-- Bottom bar: Save first (primary), Reset, saved hint -->
  <rect x="20" y="324" width="70" height="28" rx="8" fill="#4f46e5"/>
  <text x="55" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Save</text>
  <rect x="98" y="324" width="120" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="158" y="342" text-anchor="middle" font-size="11" fill="#334155">Reset to defaults</text>
  <text x="228" y="342" font-size="10" fill="#16a34a">✓ Saved</text>
</svg>
