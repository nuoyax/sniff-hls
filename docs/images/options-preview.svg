<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="440" height="320" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0f172a">Sniffls — Settings</text>
  <text x="24" y="52" font-size="11" fill="#64748b">Tune detection, downloads, and proxy.</text>

  <!-- Detection section -->
  <rect x="20" y="64" width="400" height="78" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="84" font-size="12" font-weight="700" fill="#0f172a">Detection</text>
  <text x="34" y="102" font-size="11" fill="#0f172a">Auto-detect m3u8 on every page</text>
  <text x="34" y="116" font-size="9" fill="#64748b">Sniffs network requests and shows a badge count.</text>
  <!-- toggle on -->
  <rect x="372" y="96" width="34" height="18" rx="9" fill="#4f46e5"/>
  <circle cx="404" cy="105" r="7" fill="#ffffff"/>

  <!-- Downloads section -->
  <rect x="20" y="150" width="400" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="170" font-size="12" font-weight="700" fill="#0f172a">Downloads</text>
  <text x="34" y="192" font-size="11" fill="#0f172a">Output format</text>
  <rect x="300" y="180" width="104" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="310" y="195" font-size="10" fill="#0f172a">Auto (MP4→TS)</text>
  <text x="34" y="222" font-size="11" fill="#0f172a">Concurrent segments: 8</text>
  <rect x="300" y="214" width="104" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="300" y="214" width="42" height="6" rx="3" fill="#4f46e5"/>
  <circle cx="342" cy="217" r="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>

  <!-- Proxy section -->
  <rect x="20" y="246" width="400" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="266" font-size="12" font-weight="700" fill="#0f172a">Proxy</text>
  <rect x="34" y="276" width="80" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="74" y="291" text-anchor="middle" font-size="10" fill="#0f172a">SOCKS5</text>
  <rect x="120" y="276" width="150" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="128" y="291" font-size="10" fill="#64748b">127.0.0.1</text>
  <rect x="276" y="276" width="50" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="301" y="291" text-anchor="middle" font-size="10" fill="#0f172a">1080</text>
  <rect x="332" y="276" width="56" height="22" rx="6" fill="#4f46e5"/>
  <text x="360" y="291" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Apply</text>
</svg>
